; Waveshare ESP32-S3-Touch-LCD-4 (ESP32-S3-WROOM-1 N16R8, 480x480 ST7701 RGB panel)
; Build/flash with the pioarduino VS Code extension.

[platformio]
; Adding/removing a source file makes PlatformIO wipe .pio/build; compiled files kept here
; survive that, so only files that actually changed get compiled again.
build_cache_dir = .pio/build_cache

[env:waveshare-lcd4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip   ; pinned: "stable" needs a newer PIO core than the extension ships
board = esp32-s3-devkitc1-n16r8
framework = arduino

board_build.arduino.memory_type = qio_opi   ; octal PSRAM - wrong value = boot loop
board_build.partitions = default_16MB.csv

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial goes over the native USB-C port
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.7
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.4
